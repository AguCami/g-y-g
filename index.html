<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genios y Gigantes — El juego de las civilizaciones</title>
  <link rel="icon" href="Screenshot_52.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ==================== PANTALLA DE INICIO ==================== -->
  <div id="start-screen" class="screen">
    <div class="start-box">
      <img src="Screenshot_52.png" alt="logo" class="logo" />
      <h1>Genios y Gigantes</h1>
      <p class="subtitle">El juego de mesa de las civilizaciones — versión web (hotseat)</p>

      <div class="field">
        <label>Cantidad de jugadores</label>
        <div id="player-count" class="seg">
          <button data-n="2">2</button>
          <button data-n="3">3</button>
          <button data-n="4" class="active">4</button>
        </div>
      </div>

      <div id="player-config"></div>

      <button id="btn-start" class="primary big">⚔️ Comenzar partida</button>
      <button id="btn-rules" class="ghost">📜 Ver reglas rápidas</button>
    </div>
  </div>

  <!-- ==================== JUEGO ==================== -->
  <div id="game-screen" class="screen hidden">
    <header id="topbar">
      <img src="Screenshot_52.png" alt="" class="mini-logo" />
      <div class="title-block">
        <strong>Genios y Gigantes</strong>
        <span id="phase-indicator"></span>
      </div>
      <div id="turn-banner"></div>
      <div class="top-actions">
        <button id="btn-help" class="ghost small">Reglas</button>
        <button id="btn-newgame" class="ghost small">Nueva partida</button>
      </div>
    </header>

    <main id="main-area">
      <aside id="left-panel" class="side"></aside>

      <section id="center">
        <div id="board-wrap">
          <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div id="action-bar"></div>
        <div id="hint"></div>
      </section>

      <aside id="right-panel" class="side">
        <div id="active-player-card"></div>
        <div id="log-panel">
          <h3>Crónica</h3>
          <div id="log"></div>
        </div>
      </aside>
    </main>
  </div>

  <!-- ==================== MODAL ==================== -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/archetypes.js"></script>
  <script src="js/situations.js"></script>
  <script src="js/hex.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
